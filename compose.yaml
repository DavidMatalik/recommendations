services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: books
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "books"]
      interval: 2s
      retries: 15

  api:
    image: node:26
    working_dir: /app
    command: sh -c "npm install -g pnpm@12.23.0 && pnpm install && pnpm db:migrate && pnpm dev"
    environment:
      CI: "true"
      DATABASE_URL: postgres://postgres:postgres@db:5432/books
    ports:
      - "3000:3000"
    volumes:
      - ./api:/app
      - /app/node_modules
      - pnpm-store:/root/.local/share/pnpm/store
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  pnpm-store:
